name: Assistant validation

on:
  push:
    branches:
      - assistant-validation-run-3-20260806

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run source and JVM checks
        run: |
          rm -rf .github/workflows
          python3 scripts/source-safety-check.py
          printf '\nandroid.sourceset.disallowProvider=false\nandroid.defaults.buildfeatures.resvalues=true\n' >> gradle.properties
          chmod +x gradlew scripts/*.sh
          ./gradlew :shared:check :domain:check :data:check :game:check
